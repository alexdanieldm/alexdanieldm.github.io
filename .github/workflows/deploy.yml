# Builds the static export and hands it to GitHub Pages.
#
# This replaces the old gh-pages branch push. Nothing commits build output any
# more: the artifact goes straight from the build job to Pages, so master holds
# source and only source.
#
# It needs Settings > Pages > Source set to "GitHub Actions". Until that is
# switched over, the deploy job fails and whatever is already published stays
# up, which is the failure mode I want.

name: Deploy

on:
  push:
    branches: [master]
  # A pull request into master gets the same install, checks and build, so a
  # branch that would break the site fails on the PR instead of on master. It
  # stops there: nothing is uploaded and nothing deploys.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once. Queue rather than cancel: a half-finished deploy
# that gets cancelled leaves the site in whatever state it reached.
#
# A pull request gets a group of its own. A group holds one pending run, and a
# newer one replaces it, so sharing `pages` would let a PR check cancel a
# deploy waiting its turn. In its own group, a new push to the PR cancels the
# run still checking the old one, which is the only one worth finishing.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The shelf's generated images, made again from the shelf as it is in
      # this commit: the blurred placeholders and the link preview cards. A
      # reordered shelf or a new poster never ships with a stale one because
      # nobody ran the script; the committed copies are what local builds use.
      # Before the checks, so they see exactly what gets built.
      - name: Regenerate the shelf's images
        run: npm run shelf:placeholders && npm run shelf:cards

      # The checks run before the build, so a type error or a lint failure
      # stops the deploy instead of shipping alongside it.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Everything from here on is the hand-off to Pages, which a pull request
      # never gets.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # What this deploy changes for a search engine: each page the build
      # made, compared with the same page live, while the live one is still
      # the old one. Only those get posted to IndexNow once the site is up. A
      # page that cannot be fetched is a warning; a key file that does not
      # match the key stops the deploy, since every post would be refused.
      - name: Find what this deploy changes for search engines
        id: indexnow
        if: github.event_name != 'pull_request'
        run: |
          urls=$(node scripts/indexnow.mjs changed)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Then the pages that changed, posted to IndexNow, which hands them to
      # Bing and the protocol's other members. The site is up by now, so a
      # post that fails is a warning rather than a failed deploy.
      - name: Checkout
        if: needs.build.outputs.indexnow != '[]'
        uses: actions/checkout@v4

      - name: Tell search engines what changed
        if: needs.build.outputs.indexnow != '[]'
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.indexnow }}
        run: printf '%s' "$URLS" | node scripts/indexnow.mjs submit
